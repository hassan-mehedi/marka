name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version
      - name: Test
        run: swift test
      - name: Build dmgs
        run: |
          scripts/make-dmg.sh "$GITHUB_REF_NAME" arm64
          scripts/make-dmg.sh "$GITHUB_REF_NAME" x86_64
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Marka-*.dmg \
            --title "Marka $GITHUB_REF_NAME" --generate-notes
